name: Claude Autonomous Engineer

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

# SÉCURITÉ ANTI-DOUBLON : Si un workflow se relance pour la même issue, 
# il annule immédiatement le précédent (cancel-in-progress: true)
concurrency:
  group: claude-${{ github.event.issue.number || github.event.comment.issue.number }}
  cancel-in-progress: true

jobs:
  process-issue:
    # 1. On ne se déclenche que si le label 'claude' fait partie des labels de l'issue
    # 2. Sécurité : S'il s'agit d'un événement "labeled", on ne traite QUE si le label ajouté est 'claude' ou 'bug' ou 'feature' ou 'analyze' pour éviter les triggers inutiles
    if: |
      (
        github.event.issue && 
        contains(github.event.issue.labels.*.name, 'claude') &&
        (github.event.action != 'labeled' || contains(json('["claude", "bug", "feature", "analyze"]'), github.event.label.name))
      ) ||
      (
        github.event.comment && 
        contains(github.event.issue.labels.*.name, 'claude')
      )
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (for Vitest)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install anthropic PyGithub

      - name: Run Claude Orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_CONTEXT: ${{ toJson(github.event) }}
        run: python .github/scripts/claude_orchestrator.py
