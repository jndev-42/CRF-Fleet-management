# Blueprint Render — « New + » → « Blueprint », en pointant ce dépôt.
#
# ⚠️ Ce fichier doit rester **à la racine** : Render n'y cherche `render.yaml`
# que là, et ne le découvrirait pas dans `worker/`.
#
# `rootDir: worker` : le service ne voit que ce répertoire. L'application
# Next.js du dépôt n'est ni construite ni déployée ici, et Vercel ignore ce
# fichier de son côté.
services:
  - type: web
    name: crf-psa-auth-worker
    runtime: docker
    plan: free
    # Francfort : les IdP Stellantis et le centre de données Gigya sont en eu1.
    # Une latence faible réduit le risque de dépassement des délais de login.
    region: frankfurt
    rootDir: worker
    dockerfilePath: ./Dockerfile
    # Sert aussi de préchauffage : le plan gratuit met le service en veille après
    # 15 min d'inactivité, et le réveil coûte ~50 s.
    healthCheckPath: /health
    envVars:
      # Généré par Render, à recopier dans PSA_WORKER_SECRET côté Vercel.
      - key: WORKER_SHARED_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Constantes d'application mobile, obligatoires pour l'échange de jetons
      # (l'IdP n'accepte pas `token_endpoint_auth_method: none`). Une par marque :
      # `client_id` et `client_secret` forment une paire, et un secret apparié à
      # un autre identifiant est refusé en `invalid_client`.
      # `sync: false` : à saisir dans l'interface Render, jamais dans le dépôt.
      # Seul Peugeot est requis aujourd'hui ; les autres marques échouent avec un
      # message explicite tant que leur secret n'est pas fourni.
      - key: PEUGEOT_CLIENT_SECRET
        sync: false
      - key: CITROEN_CLIENT_SECRET
        sync: false
      - key: DS_CLIENT_SECRET
        sync: false
      - key: OPEL_CLIENT_SECRET
        sync: false
